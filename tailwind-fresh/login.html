<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in – TapMad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind v4 in the browser (no build step). For production, swap this for: <link href="./dist/styles.css" rel="stylesheet"> -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
</head>
<body class="bg-white text-[#111] font-[Work_Sans,sans-serif] antialiased min-h-screen grid md:grid-cols-[1fr_1.1fr]">

  <!-- Brand panel -->
  <aside class="bg-[#FFE14D] border-b-4 md:border-b-0 md:border-r-4 border-[#111] px-6 md:px-12 py-8 md:py-12 flex flex-col justify-between gap-10">
    <a href="index.html" class="flex items-center gap-3 self-start focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-[#2F6BFF]">
      <img src="mainLogo.jpg" alt="" class="h-11 w-11 rounded-full object-cover border-[3px] border-[#111]">
      <span class="font-[Archivo_Black,sans-serif] text-2xl uppercase">TapMad</span>
    </a>

    <div>
      <h1 class="font-[Archivo_Black,sans-serif] uppercase text-4xl md:text-6xl leading-[0.95]">
        Welcome <span class="bg-white px-2 -mx-2 box-decoration-clone">back.</span>
      </h1>
      <p class="mt-5 max-w-sm text-lg leading-relaxed">Log in to reorder your medicines and track your deliveries.</p>
    </div>

    <div class="hidden md:block self-start bg-[#5BE3A0] border-[3px] border-[#111] shadow-[8px_8px_0_#111] p-5 -rotate-3 w-64">
      <p class="font-[Archivo_Black,sans-serif] uppercase text-lg leading-tight">Delivered to your door</p>
      <p class="mt-1 text-sm">Upload, pay, done.</p>
    </div>
  </aside>

  <!-- Form -->
  <main class="flex items-center justify-center px-6 md:px-12 py-12">
    <div class="w-full max-w-md">
      <h2 class="font-[Archivo_Black,sans-serif] uppercase text-3xl">Log in</h2>
      <p class="mt-2 text-[#111]/70">Don't have an account? <a href="#" class="font-bold underline underline-offset-4 hover:bg-[#FFE14D] focus-visible:outline-4 focus-visible:outline-[#2F6BFF]">Sign up</a></p>

      <form id="login-form" class="mt-8 space-y-6" novalidate>
        <div>
          <label for="identifier" class="block font-bold mb-2">Email or phone number</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" required
                 class="w-full bg-white border-[3px] border-[#111] px-4 py-3 text-lg shadow-[4px_4px_0_#111] focus:outline-none focus:bg-[#FFFBD1] focus:shadow-[6px_6px_0_#2F6BFF] transition">
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="font-bold">Password</label>
            <a href="#" class="text-sm font-bold underline underline-offset-4 hover:bg-[#FFE14D] focus-visible:outline-4 focus-visible:outline-[#2F6BFF]">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   class="w-full bg-white border-[3px] border-[#111] pl-4 pr-20 py-3 text-lg shadow-[4px_4px_0_#111] focus:outline-none focus:bg-[#FFFBD1] focus:shadow-[6px_6px_0_#2F6BFF] transition">
            <button type="button" id="toggle-password" aria-controls="password" aria-pressed="false"
                    class="absolute right-2 top-1/2 -translate-y-1/2 cursor-pointer px-3 py-1 text-sm font-bold border-2 border-[#111] bg-[#FF8FB1] hover:bg-[#ff7aa2] focus-visible:outline-4 focus-visible:outline-[#2F6BFF]">Show</button>
          </div>
        </div>

        <label class="flex items-center gap-3 cursor-pointer select-none">
          <input type="checkbox" name="remember" class="h-6 w-6 shrink-0 appearance-none border-[3px] border-[#111] bg-white checked:bg-[#5BE3A0] checked:[background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23111%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M5 12.5l4.5 4.5L19 7%22/></svg>')] focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-[#2F6BFF]">
          <span class="font-medium">Keep me logged in</span>
        </label>

        <p id="error" role="alert" class="hidden bg-[#FF8FB1] border-[3px] border-[#111] px-4 py-3 font-bold"></p>

        <button type="submit"
                class="w-full cursor-pointer bg-[#2F6BFF] text-white border-[3px] border-[#111] shadow-[6px_6px_0_#111] font-bold text-lg py-3.5 hover:translate-x-1 hover:translate-y-1 hover:shadow-[2px_2px_0_#111] transition focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-[#2F6BFF]">
          Log in
        </button>
      </form>
    </div>
  </main>

  <script>
    const pw = document.getElementById('password');
    const toggle = document.getElementById('toggle-password');
    toggle.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Hide' : 'Show';
      toggle.setAttribute('aria-pressed', String(show));
    });

    const form = document.getElementById('login-form');
    const error = document.getElementById('error');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = form.identifier.value.trim();
      if (!id || !form.password.value) {
        error.textContent = 'Please enter your email or phone number and your password.';
        error.classList.remove('hidden');
        return;
      }
      error.classList.add('hidden');
      // TODO: send id and password to your login endpoint here.
    });
  </script>
</body>
</html>
